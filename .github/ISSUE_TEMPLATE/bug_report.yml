name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran; attach a theme file if relevant (it must not contain anything private).
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `claude-theme doctor`
      render: text
    validations:
      required: true
