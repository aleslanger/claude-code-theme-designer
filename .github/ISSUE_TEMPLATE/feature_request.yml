name: Feature request
description: Suggest an improvement or a new preset
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Note that only colors documented by Claude Code can be themed; this tool never patches Claude Code.
